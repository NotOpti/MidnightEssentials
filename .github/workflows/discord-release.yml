name: Post release to Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      post_changelog:
        description: "Also post the latest release changelog (with ping)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  LOGO: https://www.midnightessentials.me/favicon.png
  SITE: https://www.midnightessentials.me/
  ROLE: "1563661616795353199"
  ID_FILE: .github/discord-download-message-id

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - name: Post changelog to Discord
        if: github.event_name == 'release' || inputs.post_changelog
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NAME: ${{ github.event.release.name }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "release" ]; then
            REL=$(gh api "repos/${{ github.repository }}/releases/latest")
            NAME=$(echo "$REL" | jq -r '.name // ""')
            TAG=$(echo "$REL" | jq -r '.tag_name')
            BODY=$(echo "$REL" | jq -r '.body // ""')
          fi

          TITLE="$NAME"
          [ -z "$TITLE" ] && TITLE="$TAG"
          TITLE="${TITLE#v}"

          {
            echo "# Version $TITLE"
            printf '%s\n' "$BODY" | tr -d '\r' | sed '/^[[:space:]]*$/d'
            echo "-# <@&$ROLE>"
          } > changelog.txt

          awk -v max=1900 -v n=0 '
            {
              if (len + length($0) + 1 > max && len > 0) {
                f = sprintf("chunk_%03d.txt", n); printf "%s", buf > f; close(f)
                n++; buf = ""; len = 0
              }
              buf = buf $0 "\n"; len += length($0) + 1
            }
            END { if (len > 0) { f = sprintf("chunk_%03d.txt", n); printf "%s", buf > f; close(f) } }
          ' changelog.txt

          LAST=$(ls chunk_*.txt | tail -n 1)
          for f in chunk_*.txt; do
            if [ "$f" = "$LAST" ]; then BUTTONS=true; else BUTTONS=false; fi
            jq -n --rawfile c "$f" --arg logo "$LOGO" --arg role "$ROLE" --arg site "$SITE" --argjson buttons "$BUTTONS" '{
              username: "MidnightEssentials",
              avatar_url: $logo,
              content: $c,
              allowed_mentions: { roles: [$role] }
            } + (if $buttons then { components: [{ type: 1, components: [
              { type: 2, style: 5, label: "Download", url: $site },
              { type: 2, style: 5, label: "Updater App", url: ($site + "#updater") }
            ]}]} else {} end)' | curl -sS --fail-with-body -H "Content-Type: application/json" -d @- "$WEBHOOK?with_components=true"
            sleep 1
          done

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Post new download message and delete the old one
        env:
          DL_WEBHOOK: ${{ secrets.DOWNLOAD_WEBHOOK }}
          OLD_ID_VAR: ${{ vars.DOWNLOAD_MESSAGE_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(gh api "repos/${{ github.repository }}/releases/latest" --jq 'if (.name // "") != "" then .name else .tag_name end')
          case "$VERSION" in v*) ;; *) VERSION="v$VERSION" ;; esac

          jq -n --arg v "$VERSION" --arg logo "$LOGO" --arg site "$SITE" '{
            username: "MidnightEssentials",
            avatar_url: $logo,
            embeds: [{
              title: ("MidnightEssentials " + $v),
              url: $site,
              description: "The all-in-one UI suite for World of Warcraft.\n\n**Recommended** · Use the Updater app. It installs the addon and keeps it up to date for you.\n**Manual** · Download the zip and replace the MidnightEssentials folders in `_retail_ > Interface > AddOns`.",
              color: 10980346,
              thumbnail: { url: $logo }
            }],
            components: [{ type: 1, components: [
              { type: 2, style: 5, label: "Download", url: $site },
              { type: 2, style: 5, label: "Updater App", url: ($site + "#updater") }
            ]}]
          }' > payload.json

          OLD_ID=""
          [ -f "$ID_FILE" ] && OLD_ID=$(cat "$ID_FILE")
          [ -z "$OLD_ID" ] && OLD_ID="$OLD_ID_VAR"

          RESP=$(curl -sS --fail-with-body -H "Content-Type: application/json" -d @payload.json "$DL_WEBHOOK?wait=true&with_components=true")
          NEW_ID=$(echo "$RESP" | jq -r .id)

          if [ -n "$OLD_ID" ]; then
            curl -sS -X DELETE "$DL_WEBHOOK/messages/$OLD_ID" || true
          fi

          echo "$NEW_ID" > "$ID_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "$ID_FILE"
          git commit -m "Update Discord message ID [skip ci]"
          git push
          echo "### Posted new download message ($VERSION), ID: \`$NEW_ID\`" >> "$GITHUB_STEP_SUMMARY"
