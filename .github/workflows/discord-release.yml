name: Post release to Discord

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  LOGO: https://www.midnightessentials.me/favicon.png
  SITE: https://www.midnightessentials.me/
  ROLE: "1563661616795353199"

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - name: Post changelog to announcements
        if: github.event_name == 'release'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NAME: ${{ github.event.release.name }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
        run: |
          jq -n --arg name "$NAME" --arg tag "$TAG" --arg body "$BODY" --arg logo "$LOGO" --arg site "$SITE" --arg role "$ROLE" '{
            username: "MidnightEssentials",
            avatar_url: $logo,
            content: ("<@&" + $role + ">"),
            allowed_mentions: { roles: [$role] },
            embeds: [{
              author: { name: "MidnightEssentials", icon_url: $logo },
              title: ("MidnightEssentials " + (if ($name | length) > 0 then $name else $tag end)),
              url: $site,
              description: (($body | .[0:3900]) + "\n\n⬇️ **[Download the latest version](" + $site + ")**"),
              color: 10980346,
              footer: { text: "Update via the Updater app or the download channel" },
              timestamp: (now | todate)
            }]
          }' | curl -sS --fail-with-body -H "Content-Type: application/json" -d @- "$WEBHOOK"

      - name: Create or update the download post
        env:
          DL_WEBHOOK: ${{ secrets.DOWNLOAD_WEBHOOK }}
          MSG_ID: ${{ vars.DOWNLOAD_MESSAGE_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(gh api "repos/${{ github.repository }}/releases/latest" --jq 'if (.name // "") != "" then .name else .tag_name end')
          case "$VERSION" in v*) ;; *) VERSION="v$VERSION" ;; esac

          jq -n --arg v "$VERSION" --arg logo "$LOGO" --arg site "$SITE" '{
            username: "MidnightEssentials",
            avatar_url: $logo,
            embeds: [{
              title: ("MidnightEssentials " + $v),
              url: $site,
              description: "The all-in-one UI suite for World of Warcraft.\n\n**Recommended** · Use the Updater app. It installs the addon and keeps it up to date for you.\n**Manual** · Download the zip and replace the MidnightEssentials folders in `_retail_ > Interface > AddOns`.",
              color: 10980346,
              thumbnail: { url: $logo },
              footer: { text: ("Updated " + (now | strftime("%d %b %Y"))) }
            }],
            components: [{ type: 1, components: [
              { type: 2, style: 5, label: "Download", url: $site },
              { type: 2, style: 5, label: "Updater App", url: ($site + "#updater") }
            ]}]
          }' > payload.json

          if [ -z "$MSG_ID" ]; then
            RESP=$(curl -sS --fail-with-body -H "Content-Type: application/json" -d @payload.json "$DL_WEBHOOK?wait=true&with_components=true")
            ID=$(echo "$RESP" | jq -r .id)
            echo "DOWNLOAD MESSAGE ID: $ID"
            echo "### Download post created. Message ID: \`$ID\`" >> "$GITHUB_STEP_SUMMARY"
          else
            curl -sS --fail-with-body -X PATCH -H "Content-Type: application/json" -d @payload.json "$DL_WEBHOOK/messages/$MSG_ID?with_components=true"
            echo "### Download post updated to $VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi
